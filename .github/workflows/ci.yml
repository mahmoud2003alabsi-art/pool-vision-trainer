name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows, MinGW single-config)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 2

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Demo pipeline (generate -> detect -> solve -> annotate)
        run: ./build/pool-trainer demo --out artifacts

      - name: Round-trip (analyze the generated table image)
        run: ./build/pool-trainer analyze artifacts/table.png --out artifacts/roundtrip

      - name: Collect executables into artifacts
        run: |
          cp build/pool-trainer* artifacts/
          cp build/pool-overlay* artifacts/ || true

      - name: Upload (demo results + executable)
        uses: actions/upload-artifact@v4
        with:
          name: pool-trainer-${{ runner.os }}
          path: artifacts
